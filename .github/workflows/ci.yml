name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.dev.txt
            backend/requirements.txt
            worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt

      - name: Verify Python dependency consistency
        run: pip check

      - name: Run pytest
        run: pytest

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  frontend-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client, frontend-admin, frontend-marketing]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: Lint ${{ matrix.app }}
        run: npm run lint
        working-directory: ${{ matrix.app }}

  frontend-typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client, frontend-admin, frontend-marketing]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: Type check ${{ matrix.app }}
        run: npm run type-check
        working-directory: ${{ matrix.app }}

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: Test ${{ matrix.app }}
        run: npm test
        working-directory: ${{ matrix.app }}

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client, frontend-admin, frontend-marketing]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: Build ${{ matrix.app }}
        run: npm run build
        working-directory: ${{ matrix.app }}

  sast-bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit (Python SAST)
        run: bandit -r backend worker -ll -x backend/app/db/migrations

  sca-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.dev.txt
            backend/requirements.txt
            worker/requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Python dependency audit
        run: pip-audit -r requirements.dev.txt

  sca-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client, frontend-admin, frontend-marketing]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: npm production audit (${{ matrix.app }})
        run: npm audit --audit-level=high --omit=dev
        working-directory: ${{ matrix.app }}

      - name: npm full dependency audit (${{ matrix.app }})
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.app }}

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner

  dockerfile-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - infra/Dockerfile.backend
          - infra/Dockerfile.frontend
          - infra/Dockerfile.worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  repository-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          cache-dir: .trivycache

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: infra/Dockerfile.backend
          - name: frontend-client
            dockerfile: infra/Dockerfile.frontend
            app_dir: frontend-client
          - name: frontend-admin
            dockerfile: infra/Dockerfile.frontend
            app_dir: frontend-admin
          - name: frontend-marketing
            dockerfile: infra/Dockerfile.frontend
            app_dir: frontend-marketing
          - name: worker
            dockerfile: infra/Dockerfile.worker
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        run: |
          if [ -n "${{ matrix.app_dir || '' }}" ]; then
            docker build -f ${{ matrix.dockerfile }} --build-arg APP_DIR=${{ matrix.app_dir }} --build-arg FRONTEND_MODE=production -t map-pack-${{ matrix.name }}:ci .
          else
            docker build -f ${{ matrix.dockerfile }} -t map-pack-${{ matrix.name }}:ci .
          fi

      - name: Scan ${{ matrix.name }} image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: map-pack-${{ matrix.name }}:ci
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          vuln-type: 'os,library'
          ignore-unfixed: true
          cache-dir: .trivycache
