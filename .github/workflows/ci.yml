name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:latest -color

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 -r shellcheck

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            semgrep/semgrep:latest \
            semgrep scan \
              --config p/owasp-top-ten \
              --config p/secrets \
              --config p/python \
              --config p/typescript \
              --config p/dockerfile \
              --sarif \
              --output semgrep.sarif \
              --error

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  migration-sanity:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Supabase migration ordering and transaction endings
        run: |
          python - <<'PY'
          from pathlib import Path

          migrations = sorted(Path("infra/supabase/migrations").glob("*.sql"))
          if not migrations:
              raise SystemExit("No Supabase migrations found")

          names = [path.name for path in migrations]
          if names != sorted(names):
              raise SystemExit("Supabase migration filenames are not lexicographically ordered")

          for path in migrations:
              text = path.read_text(encoding="utf-8").strip()
              if not text:
                  raise SystemExit(f"{path} is empty")
              if text.count("$$") % 2:
                  raise SystemExit(f"{path} has an unmatched dollar-quoted block delimiter")
          print(f"Checked {len(migrations)} Supabase migrations")
          PY

  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.dev.txt
            backend/requirements.txt
            worker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.dev.txt

      - name: Verify Python dependency consistency
        run: pip check

      - name: Run pytest
        run: pytest

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  frontend-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client, frontend-admin, frontend-marketing]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: Lint ${{ matrix.app }}
        run: npm run lint
        working-directory: ${{ matrix.app }}

  frontend-typecheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client, frontend-admin, frontend-marketing]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: Type check ${{ matrix.app }}
        run: npm run type-check
        working-directory: ${{ matrix.app }}

  frontend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: Test ${{ matrix.app }}
        run: npm test
        working-directory: ${{ matrix.app }}

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client, frontend-admin, frontend-marketing]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: Build ${{ matrix.app }}
        run: npm run build
        working-directory: ${{ matrix.app }}

  sast-bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit (Python SAST)
        run: bandit -r backend worker -ll -x backend/app/db/migrations

  sca-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.dev.txt
            backend/requirements.txt
            worker/requirements.txt

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Python dependency audit
        run: pip-audit -r requirements.dev.txt

  sca-node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [frontend-client, frontend-admin, frontend-marketing]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: npm production audit (${{ matrix.app }})
        run: npm audit --audit-level=high --omit=dev
        working-directory: ${{ matrix.app }}

      - name: npm full dependency audit (${{ matrix.app }})
        run: npm audit --audit-level=high
        working-directory: ${{ matrix.app }}

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --no-banner

  dockerfile-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - infra/Dockerfile.backend
          - infra/Dockerfile.frontend
          - infra/Dockerfile.worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lint ${{ matrix.dockerfile }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  repository-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          cache-dir: .trivycache

  dast-backend:
    runs-on: ubuntu-latest
    needs: [backend-tests]
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start backend for DAST
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/map_pack
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          SUPABASE_JWT_SECRET: ci-placeholder
          STRIPE_SECRET_KEY: ''
          STRIPE_WEBHOOK_SECRET: ''
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > backend-dast.log 2>&1 &
          echo "$!" > backend-dast.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend-dast.log
          exit 1

      - name: OWASP ZAP baseline scan backend
        run: |
          mkdir -p zap-results
          docker run --rm --network host \
            -v "${PWD}/zap-results:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://127.0.0.1:8000 \
              -J zap-backend.json \
              -r zap-backend.html \
              -I

      - name: Upload backend DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-backend
          path: |
            zap-results/
            backend-dast.log

  dast-frontend:
    runs-on: ubuntu-latest
    needs: [frontend-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: frontend-client
            port: 3000
            target: http://127.0.0.1:3000/sign-in
          - app: frontend-admin
            port: 3002
            target: http://127.0.0.1:3002/sign-in
          - app: frontend-marketing
            port: 3001
            target: http://127.0.0.1:3001/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: ${{ matrix.app }}

      - name: Start ${{ matrix.app }} for DAST
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000/api
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          NEXT_PUBLIC_ADMIN_APP_URL: http://127.0.0.1:3002
        run: |
          npm run dev -- --hostname 127.0.0.1 --port ${{ matrix.port }} > ../${{ matrix.app }}-dast.log 2>&1 &
          echo "$!" > ../${{ matrix.app }}-dast.pid
          for attempt in {1..45}; do
            if curl -fsS "${{ matrix.target }}" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat ../${{ matrix.app }}-dast.log
          exit 1
        working-directory: ${{ matrix.app }}

      - name: OWASP ZAP baseline scan ${{ matrix.app }}
        run: |
          mkdir -p zap-results
          docker run --rm --network host \
            -v "${PWD}/zap-results:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t "${{ matrix.target }}" \
              -J "zap-${{ matrix.app }}.json" \
              -r "zap-${{ matrix.app }}.html" \
              -I

      - name: Upload frontend DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-${{ matrix.app }}
          path: |
            zap-results/
            ${{ matrix.app }}-dast.log

  container-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: infra/Dockerfile.backend
          - name: frontend-client
            dockerfile: infra/Dockerfile.frontend
            app_dir: frontend-client
          - name: frontend-admin
            dockerfile: infra/Dockerfile.frontend
            app_dir: frontend-admin
          - name: frontend-marketing
            dockerfile: infra/Dockerfile.frontend
            app_dir: frontend-marketing
          - name: worker
            dockerfile: infra/Dockerfile.worker
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build ${{ matrix.name }} image
        run: |
          if [ -n "${{ matrix.app_dir || '' }}" ]; then
            docker build -f ${{ matrix.dockerfile }} --build-arg APP_DIR=${{ matrix.app_dir }} --build-arg FRONTEND_MODE=production -t map-pack-${{ matrix.name }}:ci .
          else
            docker build -f ${{ matrix.dockerfile }} -t map-pack-${{ matrix.name }}:ci .
          fi

      - name: Scan ${{ matrix.name }} image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: map-pack-${{ matrix.name }}:ci
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          vuln-type: 'os,library'
          ignore-unfixed: true
          cache-dir: .trivycache

  pre-deploy-gate:
    runs-on: ubuntu-latest
    needs:
      - workflow-lint
      - shellcheck
      - semgrep
      - migration-sanity
      - backend-tests
      - dependency-review
      - codeql
      - frontend-lint
      - frontend-typecheck
      - frontend-tests
      - frontend-build
      - sast-bandit
      - sca-python
      - sca-node
      - secrets-scan
      - dockerfile-lint
      - repository-scan
      - dast-backend
      - dast-frontend
      - container-scan
    if: always()
    steps:
      - name: Enforce deploy readiness
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {
              name: data["result"]
              for name, data in needs.items()
              if data["result"] not in {"success", "skipped"}
          }
          if failed:
              print("Pre-deploy gate failed:")
              for name, result in sorted(failed.items()):
                  print(f"- {name}: {result}")
              sys.exit(1)
          print("Pre-deploy gate passed")
          PY
